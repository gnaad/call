<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Voice Call</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      input,
      button {
        padding: 8px;
        margin: 5px;
      }

      #status {
        border: 1px solid #ccc;
        padding: 10px;
        margin-top: 10px;
        background: #f8f8f8;
      }
    </style>
  </head>

  <body>
    <h2>Voice Call</h2>

    <div>
      Caller ID:
      <b><span id="callerId">Generating Id...</span></b>
    </div>
    <br />

    <input id="receiverId" placeholder="Enter Receiver ID" />
    <button id="callBtn" onclick="makeCall()">Call</button>
    <button id="muteBtn" onclick="toggleMute()" style="display: none">
      Mute
    </button>
    <button id="hangupBtn" onclick="disconnectCall()" style="display: none">
      Hangup
    </button>
    <button id="pickIncoming" onclick="pickCall()" style="display: none">
      Pick
    </button>
    <button id="rejectIncoming" onclick="rejectCall()" style="display: none">
      Reject
    </button>
    <div id="status"></div>
    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
      let peer;
      let currentCall;
      let localStream;
      let dataConn;
      let incomingCall = null;
      let callEnding = false;

      function log(message) {
        console.log(message);
        const status = document.getElementById("status");
        const time = new Date().toLocaleTimeString();
        status.innerHTML += "[" + time + "] " + message + "<br>";
        status.scrollTop = status.scrollHeight;
      }

      async function getMicrophone() {
        if (localStream) {
          return localStream;
        }
        try {
          log("Requesting microphone permission");
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          log("Microphone permission granted");
          localStream.getAudioTracks().forEach((track) => {
            log("Input Device = " + track.label);
          });
          return localStream;
        } catch (e) {
          log("Microphone permission denied");
          console.error(e);
          throw e;
        }
      }

      async function init() {
        log("Application initiated");

        log("Creating connection");
        peer = new Peer({
          debug: 3,
        });
        log("Connection created");

        peer.on("open", (id) => {
          log("Peer connected");
          log("Caller Id = " + id);
          document.getElementById("callerId").innerText = id;
          console.log("Connection opened", id);
        });

        peer.on("call", (call) => {
          incomingCall = call;
          hideCallButton();
          log("Incoming call from = " + call.peer);
          showPickRejectButton();
          call.on("close", () => {
            currentCall = null;
            log("Incoming call closed");
            incomingCall = null;
            showCallButton();
            hideMuteHangupButton();
            hidePickRejectButton();
            resetMuteState();
            const audio = document.getElementById("remoteAudio");
            audio.pause();
            audio.srcObject = null;
          });
        });

        peer.on("connection", (conn) => {
          dataConn = conn;
          setupDataConnection(conn);
        });

        peer.on("disconnected", () => {
          log("Receiver disconnected");
        });

        peer.on("close", () => {
          log("Connection closed");
        });

        peer.on("error", (err) => {
          log("Connection Error: " + err.type);
          console.error("Connection error: ", err);
        });
      }

      async function pickCall() {
        callEnding = false;
        if (!incomingCall) {
          return;
        }
        try {
          const stream = await getMicrophone();
          currentCall = incomingCall;
          currentCall.answer(stream);
          setupCall(currentCall);
          hideCallButton();
          showMuteHangupButton();
          log("Call picked");
          incomingCall = null;
          hidePickRejectButton();
        } catch (e) {
          log("Unable to access microphone");
          console.error(e);
        }
      }

      function rejectCall() {
        if (!incomingCall) {
          return;
        }
        if (dataConn && dataConn.open) {
          dataConn.send({
            type: "callRejected",
          });
        }
        incomingCall.close();
        log("Incoming call rejected");
        incomingCall = null;
        hidePickRejectButton();
        showCallButton();
        resetMuteState();
      }

      let isMuted = false;
      function toggleMute() {
        if (!localStream) {
          log("No audio available");
          return;
        }

        localStream.getAudioTracks().forEach((track) => {
          track.enabled = isMuted;
        });

        isMuted = !isMuted;

        const btn = document.getElementById("muteBtn");
        btn.innerText = isMuted ? "Unmute" : "Mute";
        log(isMuted ? "Microphone muted" : "Microphone unmuted");
        if (dataConn && dataConn.open) {
          dataConn.send({
            type: "muteStatus",
            muted: isMuted,
          });
        }
      }

      function resetMuteState() {
        isMuted = false;
        document.getElementById("muteBtn").innerText = "Mute";
      }

      function setupCall(call) {
        log("Adding call listeners");
        console.log("Call Object", call);

        call.on("stream", (stream) => {
          log("Receiver stream received");
          console.log("Remote Stream: ", stream);
          const audio = document.getElementById("remoteAudio");
          audio.srcObject = stream;
          audio.play().catch((err) => {
            console.error("Audio play failed", err);
          });
          const tracks = stream.getAudioTracks();
          log("Receiver audio = " + tracks.length);
          console.log("Remote Tracks: ", tracks);
          showMuteHangupButton();
        });

        call.on("close", () => {
          currentCall = null;
          log("Call closed");
          showCallButton();
          hideMuteHangupButton();
          hidePickRejectButton();
          resetMuteState();
          document.getElementById("remoteAudio").srcObject = null;
          if (localStream) {
            localStream.getTracks().forEach((track) => track.stop());
            localStream = null;
            log("Microphone stopped");
          }
        });

        call.on("error", (err) => {
          log("Call Error");
          console.error("Call Error", err);
        });

        if (call.peerConnection) {
          call.peerConnection.oniceconnectionstatechange = () => {
            log("Call Health = " + call.peerConnection.iceConnectionState);
            console.log("ICE STATE", call.peerConnection.iceConnectionState);
          };

          call.peerConnection.onconnectionstatechange = () => {
            log("Connection Status = " + call.peerConnection.connectionState);
            console.log(
              "CONNECTION STATE",
              call.peerConnection.connectionState,
            );
            if (
              call.peerConnection.connectionState === "failed" ||
              call.peerConnection.connectionState === "disconnected"
            ) {
              log("Peer disconnected");
              disconnectCall();
            }
          };
        }
      }

      async function makeCall() {
        callEnding = false;
        const receiverId = document.getElementById("receiverId").value.trim();

        if (!receiverId) {
          alert("Enter Receiver ID");
          return;
        }

        try {
          await getMicrophone();
          dataConn = peer.connect(receiverId);
          setupDataConnection(dataConn);
        } catch (e) {
          log("Call cancelled");
        }
      }

      function disconnectCall() {
        if (callEnding) return;
        callEnding = true;
        incomingCall = null;
        resetMuteState();
        showCallButton();
        hideMuteHangupButton();
        if (dataConn?.open) {
          dataConn.send({
            type: "callCancelled",
          });
        }
        if (currentCall) {
          currentCall.close();
          currentCall = null;
        }

        if (dataConn) {
          dataConn.close();
          dataConn = null;
        }

        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
          localStream = null;
          log("Microphone stopped");
        }
        hidePickRejectButton();
        const audio = document.getElementById("remoteAudio");
        audio.pause();
        audio.srcObject = null;
        log("Call Disconnected");
      }

      window.addEventListener("beforeunload", () => {
        disconnectCall();

        if (peer) {
          peer.destroy();
        }
      });

      function setupDataConnection(conn) {
        if (conn._initialized) return;
        conn._initialized = true;
        conn.on("open", () => {
          log("Data channel ready");
          const receiverId = document.getElementById("receiverId").value.trim();
          if (!currentCall && receiverId) {
            hideCallButton();
            log("Calling = " + receiverId);

            currentCall = peer.call(receiverId, localStream);

            showRingingControls();
            setupCall(currentCall);
          }
        });

        conn.on("data", (data) => {
          console.log("Received:", data);

          if (data.type === "muteStatus") {
            log(
              data.muted
                ? "Receiver muted microphone"
                : "Receiver unmuted microphone",
            );
          }

          if (data.type === "callRejected") {
            log("Receiver rejected the call");

            if (currentCall) {
              currentCall.close();
              currentCall = null;
            }

            hideMuteHangupButton();
            showCallButton();
          }

          if (data.type === "callCancelled") {
            log("Caller cancelled the call");

            incomingCall = null;
            hidePickRejectButton();
            hideMuteHangupButton();
            showCallButton();

            resetMuteState();

            const audio = document.getElementById("remoteAudio");
            audio.pause();
            audio.srcObject = null;

            if (localStream) {
              localStream.getTracks().forEach((track) => track.stop());
              localStream = null;
            }
          }
        });

        conn.on("close", () => {
          log("Data connection closed");
        });
      }

      function showPickRejectButton() {
        document.getElementById("pickIncoming").style.display = "inline-block";
        document.getElementById("rejectIncoming").style.display =
          "inline-block";
      }

      function hidePickRejectButton() {
        document.getElementById("pickIncoming").style.display = "none";
        document.getElementById("rejectIncoming").style.display = "none";
      }

      function showCallButton() {
        document.getElementById("callBtn").style.display = "inline-block";
      }

      function hideCallButton() {
        document.getElementById("callBtn").style.display = "none";
      }

      function showMuteHangupButton() {
        document.getElementById("muteBtn").style.display = "inline-block";
        document.getElementById("hangupBtn").style.display = "inline-block";
      }

      function hideMuteHangupButton() {
        document.getElementById("muteBtn").style.display = "none";
        document.getElementById("hangupBtn").style.display = "none";
      }

      function showRingingControls() {
        document.getElementById("hangupBtn").style.display = "inline-block";
      }
      window.onload = init;
    </script>
  </body>
</html>
