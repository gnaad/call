<!doctype html>
<html ng-app="voiceApp">
  <head>
    <meta charset="UTF-8" />
    <title>Voice Call</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
      body {
        background: #f4f7fb;
        min-height: 100vh;
      }

      .voice-card {
        max-width: 700px;
        margin: auto;
        margin-top: 20px;
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .peer-id-box {
        background: #eef4ff;
        border-radius: 12px;
        padding: 12px;
        word-break: break-all;
      }

      .logs {
        height: 250px;
        overflow-y: auto;
        background: #0f172a;
        color: #dbeafe;
        border-radius: 12px;
        padding: 12px;
        font-size: 14px;
      }

      .action-buttons .btn {
        min-width: 120px;
      }

      @media (max-width: 576px) {
        .action-buttons .btn {
          width: 100%;
          margin-bottom: 10px;
        }

        .logs {
          height: 200px;
        }
      }
    </style>
  </head>

  <body ng-controller="VoiceController">
    <div class="container py-3">
      <div class="card voice-card">
        <div class="card-body">
          <h3 class="text-center mb-4">
            <i class="bi bi-telephone-fill text-success"></i>
            Voice Call
          </h3>
          <p class="text-center fs-6 text-danger">
            This application is using PeerServer
          </p>

          <div class="mb-3">
            <label class="form-label fw-bold">Caller ID</label>

            <div
              class="peer-id-box d-flex justify-content-between align-items-center"
            >
              <span>{{callerId}}</span>

              <button
                class="btn btn-sm btn-outline-primary"
                ng-click="copyCallerId()"
              >
                <i class="bi bi-clipboard"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Receiver ID</label>

            <input
              type="text"
              class="form-control"
              ng-model="receiverId"
              placeholder="Enter Receiver Peer ID"
            />
          </div>

          <div
            class="action-buttons d-flex flex-wrap gap-2 justify-content-center mb-4"
          >
            <button
              class="btn btn-success"
              ng-show="showCall"
              ng-click="makeCall()"
            >
              <i class="bi bi-telephone-fill"></i>
              Call
            </button>

            <button
              class="btn btn-warning"
              ng-show="showMute"
              ng-click="toggleMute()"
            >
              <i
                class="bi"
                ng-class="{
              'bi-mic-mute-fill': muteButtonText === 'Unmute',
              'bi-mic-fill': muteButtonText === 'Mute'
            }"
              ></i>
              {{muteButtonText}}
            </button>

            <button
              class="btn btn-danger"
              ng-show="showHangup"
              ng-click="disconnectCall()"
            >
              <i class="bi bi-telephone-x-fill"></i>
              Hangup
            </button>

            <button
              class="btn btn-primary"
              ng-show="showPick"
              ng-click="pickCall()"
            >
              <i class="bi bi-telephone-inbound-fill"></i>
              Pick
            </button>

            <button
              class="btn btn-secondary"
              ng-show="showReject"
              ng-click="rejectCall()"
            >
              <i class="bi bi-x-circle-fill"></i>
              Reject
            </button>
          </div>

          <h6 class="fw-bold mb-2">
            <i class="bi bi-terminal-fill"></i>
            Activity Log
          </h6>

          <div class="logs">
            <div ng-repeat="msg in logs track by $index">{{msg}}</div>
          </div>
        </div>
      </div>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
      var app = angular.module("voiceApp", []);

      app.controller("VoiceController", function ($scope, $window) {
        let peer;
        let currentCall = null;
        let localStream = null;
        let dataConnection = null;
        let incomingCall = null;
        let callEnding = false;
        let isMuted = false;

        $scope.callerId = "Generating Id...";
        $scope.receiverId = "";
        $scope.logs = [];

        $scope.showCall = true;
        $scope.showMute = false;
        $scope.showHangup = false;
        $scope.showPick = false;
        $scope.showReject = false;

        $scope.muteButtonText = "Mute";

        function updateView() {
          if (!$scope.$$phase) {
            $scope.$applyAsync();
          }
        }

        function log(message) {
          const time = new Date().toLocaleTimeString();
          if ($scope.logs.length > 200) {
            $scope.logs.shift();
          }
          $scope.logs.push("[" + time + "] " + message);
          updateView();
        }

        async function getPermission() {
          if (localStream) {
            return localStream;
          }

          try {
            log("Requesting microphone permission");

            localStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });

            log("Microphone permission granted");

            localStream.getAudioTracks().forEach((track) => {
              log("Input Device = " + track.label);
            });

            return localStream;
          } catch (e) {
            log("Microphone permission denied");
            throw e;
          }
        }

        function showCallButton() {
          $scope.showCall = true;
          updateView();
        }

        function hideCallButton() {
          $scope.showCall = false;
          updateView();
        }

        function showMuteHangupButton() {
          $scope.showMute = true;
          $scope.showHangup = true;
          updateView();
        }

        function hideMuteHangupButton() {
          $scope.showMute = false;
          $scope.showHangup = false;
          updateView();
        }

        function showPickRejectButton() {
          $scope.showPick = true;
          $scope.showReject = true;
          updateView();
        }

        function hidePickRejectButton() {
          $scope.showPick = false;
          $scope.showReject = false;
          updateView();
        }

        function resetMuteState() {
          isMuted = false;
          $scope.muteButtonText = "Mute";
          updateView();
        }

        function clearRemoteAudio() {
          const audio = document.getElementById("remoteAudio");
          audio.pause();
          audio.srcObject = null;
        }

        function setupCall(call) {
          call.on("stream", function (stream) {
            log("Receiver stream received");

            const audio = document.getElementById("remoteAudio");
            audio.srcObject = stream;
            audio.play().catch((err) => {
              log("Error in audio = " + err.message);
            });

            showMuteHangupButton();
          });

          call.on("close", function () {
            if (callEnding) {
              return;
            }
            currentCall = null;
            log("Call closed");

            showCallButton();
            hideMuteHangupButton();
            hidePickRejectButton();

            resetMuteState();
            clearRemoteAudio();

            if (localStream) {
              localStream.getTracks().forEach((track) => {
                track.stop();
              });
              localStream = null;
            }
          });

          call.on("error", function (err) {
            log("Call Error");
          });

          if (call.peerConnection) {
            call.peerConnection.oniceconnectionstatechange = () => {
              log("Call Health = " + call.peerConnection.iceConnectionState);
            };

            call.peerConnection.onconnectionstatechange = () => {
              log("Connection Status = " + call.peerConnection.connectionState);

              if (
                call.peerConnection.connectionState === "failed" ||
                call.peerConnection.connectionState === "disconnected"
              ) {
                log("Peer disconnected");
                $scope.disconnectCall();
              }
            };
          }
        }

        function setupDataConnection(conn) {
          if (conn._initialized) {
            return;
          }
          conn._initialized = true;
          conn.on("open", function () {
            log("Data channel ready");

            if (!currentCall && $scope.receiverId) {
              hideCallButton();
              log("Calling = " + $scope.receiverId);
              currentCall = peer.call($scope.receiverId, localStream);
              $scope.showHangup = true;
              setupCall(currentCall);
              updateView();
            }
          });

          conn.on("data", function (data) {
            if (data.type === "muteStatus") {
              log(
                data.muted
                  ? "Receiver muted microphone"
                  : "Receiver unmuted microphone",
              );
            }

            if (data.type === "callRejected") {
              log("Receiver rejected the call");
              if (currentCall) {
                currentCall.close();
                currentCall = null;
              }
              hideMuteHangupButton();
              showCallButton();
              if (localStream) {
                localStream.getTracks().forEach((track) => track.stop());
                localStream = null;
              }
            }

            if (data.type === "callCancelled") {
              callEnding = false;
              log("Caller cancelled the call");
              incomingCall = null;

              clearRemoteAudio();
              hidePickRejectButton();
              hideMuteHangupButton();
              showCallButton();
              resetMuteState();
            }
          });

          conn.on("close", function () {
            log("Connection closed");

            dataConnection = null;

            clearRemoteAudio();
            showCallButton();
            hideMuteHangupButton();
            hidePickRejectButton();
          });
        }

        $scope.makeCall = async function () {
          callEnding = false;
          if ($scope.receiverId === $scope.callerId) {
            alert("Cannot call yourself");
            return;
          }
          if (!$scope.receiverId) {
            alert("Enter Receiver ID");
            return;
          }

          try {
            await getPermission();
            dataConnection = peer.connect($scope.receiverId);
            setupDataConnection(dataConnection);
          } catch (e) {
            log("Call cancelled");
          }
        };

        $scope.pickCall = async function () {
          callEnding = false;
          if (!incomingCall) {
            return;
          }

          const stream = await getPermission();
          currentCall = incomingCall;
          currentCall.answer(stream);
          setupCall(currentCall);

          hideCallButton();
          showMuteHangupButton();
          hidePickRejectButton();

          incomingCall = null;
          log("Call picked");
        };

        $scope.rejectCall = function () {
          if (!incomingCall) {
            return;
          }

          if (dataConnection && dataConnection.open) {
            dataConnection.send({
              type: "callRejected",
            });
          }

          if (localStream) {
            localStream.getTracks().forEach((track) => {
              track.stop();
            });
            localStream = null;
          }

          incomingCall.close();
          incomingCall = null;

          hidePickRejectButton();
          showCallButton();

          log("Incoming call rejected");
        };

        $scope.toggleMute = function () {
          if (!localStream) {
            return;
          }

          localStream.getAudioTracks().forEach((track) => {
            track.enabled = isMuted;
          });

          isMuted = !isMuted;
          $scope.muteButtonText = isMuted ? "Unmute" : "Mute";

          updateView();

          if (dataConnection && dataConnection.open) {
            dataConnection.send({
              type: "muteStatus",
              muted: isMuted,
            });
          }
        };

        $scope.disconnectCall = function () {
          if (callEnding) {
            return;
          }

          callEnding = true;

          if (dataConnection?.open) {
            dataConnection.send({
              type: "callCancelled",
            });
          }

          if (currentCall) {
            currentCall.close();
            currentCall = null;
          }

          if (dataConnection) {
            dataConnection.close();
            dataConnection = null;
          }

          if (localStream) {
            localStream.getTracks().forEach((track) => {
              track.stop();
            });
            localStream = null;
          }

          showCallButton();
          hideMuteHangupButton();
          hidePickRejectButton();
          clearRemoteAudio();

          log("Call Disconnected");
        };

        function init() {
          log("Application started");
          peer = new Peer({
            config: {
              iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
              sdpSemantics: "unified-plan",
            },
          });

          log("Creating connection");
          peer.on("open", function (id) {
            $scope.callerId = id;

            log("Peer connected");
            log("Caller Id = " + id);
            updateView();
          });
          log("Connection created");

          peer.on("connection", function (connection) {
            dataConnection = connection;
            setupDataConnection(connection);
          });

          peer.on("call", function (call) {
            if (incomingCall || currentCall) {
              call.close();
              return;
            }
            incomingCall = call;

            hideCallButton();
            showPickRejectButton();

            call.on("close", function () {
              callEnding = false;
              if (incomingCall === call) {
                incomingCall = null;
                hidePickRejectButton();
                showCallButton();
                log("Caller disconnected");
              }
            });

            log("Incoming call from = " + call.peer);
          });

          peer.on("error", function (err) {
            log("Connection Error = " + err.type);
            $scope.disconnectCall();
          });
        }

        $window.addEventListener("beforeunload", function () {
          if (peer) {
            peer.destroy();
          }
        });

        $scope.$on("$destroy", function () {
          if (peer) {
            peer.destroy();
          }
        });
        init();
      });
    </script>
  </body>
</html>
